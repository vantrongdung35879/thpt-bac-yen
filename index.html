<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>THPT Bắc Yên – Bổ sung thông tin học sinh</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="card hero">
      <div class="brand">THPT BẮC YÊN</div>
      <h1>Hoàn thiện thông tin học sinh</h1>
      <p class="muted">Hệ thống chỉ hiển thị những thông tin bạn còn thiếu.</p>
    </section>

    <section id="loading" class="card center"><div class="spinner"></div><p>Đang nhận diện học sinh…</p></section>

    <section id="error" class="card hidden">
      <h2>Không thể mở biểu mẫu</h2>
      <p id="errorText" class="error-text"></p>
      <p class="muted">Hãy dùng đúng đường dẫn cá nhân do nhà trường cung cấp.</p>
    </section>

    <section id="studentApp" class="hidden">
      <div class="card student-head">
        <div>
          <div class="eyebrow">HỌC SINH</div>
          <h2 id="studentName"></h2>
          <p id="studentClass" class="muted"></p>
        </div>
        <div id="statusBadge" class="status pending">Chưa hoàn thành</div>
      </div>

      <form id="studentForm" class="card form-card" novalidate>
        <div id="fields"></div>
        <div id="emptyState" class="success-panel hidden">
          <strong>✓ Bạn đã điền đủ thông tin.</strong>
          <span>Bấm nút bên dưới để xác nhận hoàn thành.</span>
        </div>
        <div class="form-actions">
          <button id="submitBtn" class="btn primary" type="submit"><span>LƯU VÀ HOÀN THÀNH</span></button>
        </div>
        <div id="formMessage" class="form-message" aria-live="polite"></div>
      </form>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
